# The visitor's address: Cloudflare puts it in CF-Connecting-IP (it passes through the host's nginx);
# the API uses it for the login attempt limit.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    # Photos up to 30 MB; a 2.5D model save sends two rasters of up to 30 MB each.
    client_max_body_size 64m;

    # Repeated in every location with its own add_header (nginx does not merge them).
    set $csp "default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Originals keep the phone's EXIF (GPS, model, time) and the app never shows them.
    location ~* ^/media/.*/original\.[a-z0-9]+$ {
        return 404;
    }

    location /media/ {
        alias /data/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        # The MapLibre worker is an .mjs module, which nginx's mime.types does not know (a module worker
        # served as octet-stream fails to load).
        types {
            text/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            font/woff2 woff2;
            font/woff woff;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
