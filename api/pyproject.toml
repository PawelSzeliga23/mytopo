[project]
name = "topo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "geoalchemy2[shapely]>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-slugify>=8.0",
    "sqlalchemy-continuum>=1.8,<1.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pillow>=10.4",
    "numpy>=2.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.scripts]
topo = "topo.cli:app"

[project.optional-dependencies]
depth = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: wymaga modelu głębi (torch, transformers) — uruchamiaj w usłudze depth: pytest -m slow"]
addopts = "-m 'not slow'"
